[workspace]
members = ["."]

[package]
exclude = ["BACKLOG.md", "target/"]
name = "ebpfsieve"
version = "0.1.6"
edition = "2021"
rust-version = "1.85"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
description = "Byte-frequency prefilter for read-heavy scanning pipelines with optional eBPF offload"
license = "MIT OR Apache-2.0"
repository = "https://github.com/santhreal/ebpfsieve"
homepage = "https://santh.dev"
documentation = "https://docs.rs/ebpfsieve"
readme = "README.md"
keywords = ["ebpf", "prefilter", "pattern-matching", "filtering", "performance"]
categories = ["network-programming", "os", "concurrency"]

[package.metadata.santh]
status = "stable"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "build.rs"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }
thiserror = "2"
libc = "0.2"
aya = { version = "0.13", optional = true }
# ebpfkit is published on crates.io; consume it by version so the
# standalone ebpfsieve crate resolves for external users.
ebpfkit = { version = "0.1", optional = true }

[[test]]
name = "shard_s_perf_pmg_edge"
path = "tests/shard_s_perf_pmg_edge.rs"

[dev-dependencies]
proptest = "1.0"
rayon = "1.5"
serde_json = "1.0"
tempfile = "3.2"

[features]
default = []
serde = ["dep:serde", "dep:toml"]
kernel-bpf = ["dep:aya"]
socket-bpf = ["dep:ebpfkit"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
